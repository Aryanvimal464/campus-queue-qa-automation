<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Campus Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="cq-auth-wrap">
  <div class="cq-auth-card">
    <div class="brand">
      <span class="brand-mark">CQ</span>
      <span class="fw-bold" style="font-family:'Sora',sans-serif;">Campus Queue</span>
    </div>
    <h1 class="h4 mb-1">Welcome back</h1>
    <p class="text-secondary mb-4" style="font-size:0.9rem;">Log in to check or generate your token.</p>

    {% if error %}
      <div class="alert-cq alert-cq-danger mb-3" id="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="login-button">Log in</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:0.88rem;">
      New to Campus Queue? <a href="{{ url_for('register') }}" id="go-to-register-link">Create an account</a>
    </p>

    <div class="mt-4 pt-3" style="border-top:1px solid var(--border); font-size:0.78rem; color:var(--ink-soft);">
      <strong>Demo accounts</strong><br>
      Student — student@test.com / Student@123<br>
      Staff — staff@test.com / Staff@123<br>
      Admin — admin@test.com / Admin@123
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

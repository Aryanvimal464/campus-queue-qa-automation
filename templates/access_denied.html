<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if not_found %}Page not found{% else %}Access denied{% endif %} | Campus Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="cq-auth-wrap" style="background:var(--paper);">
  <div class="cq-auth-card text-center" id="access-denied-box">
    <div class="brand justify-content-center">
      <span class="brand-mark">CQ</span>
      <span class="fw-bold" style="font-family:'Sora',sans-serif;">Campus Queue</span>
    </div>
    {% if not_found %}
      <h1 class="h3 mb-2">Page not found</h1>
      <p class="text-secondary">The page you're looking for doesn't exist or has moved.</p>
    {% else %}
      <h1 class="h3 mb-2" id="access-denied-heading">Access denied</h1>
      <p class="text-secondary">You don't have permission to view this page with your current role.</p>
    {% endif %}
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2">Back to home</a>
  </div>
</div>
</body>
</html>

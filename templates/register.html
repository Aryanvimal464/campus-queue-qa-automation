<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Campus Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="cq-auth-wrap">
  <div class="cq-auth-card" style="max-width:480px;">
    <div class="brand">
      <span class="brand-mark">CQ</span>
      <span class="fw-bold" style="font-family:'Sora',sans-serif;">Campus Queue</span>
    </div>
    <h1 class="h4 mb-1">Create your student account</h1>
    <p class="text-secondary mb-4" style="font-size:0.9rem;">Staff and admin accounts are created by the administrator.</p>

    {% if error %}
      <div class="alert-cq alert-cq-danger mb-3" id="registration-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" id="register-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ form.name if form else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ form.email if form else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="phone">Phone number</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ form.phone if form else '' }}" placeholder="10-digit number" required>
        <div class="field-hint">Exactly 10 digits, no spaces or symbols.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="register-button">Create account</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:0.88rem;">
      Already have an account? <a href="{{ url_for('login') }}" id="go-to-login-link">Log in</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Campus Queue{% endblock %} | Campus Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="cq-navbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand" href="{{ url_for('home') }}">
      <span class="brand-mark">CQ</span> Campus Queue
    </a>
    <div class="d-none d-md-flex align-items-center">
      <a class="nav-link {% if request.path == url_for('home') %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
      <a class="nav-link {% if request.path == url_for('about') %}active{% endif %}" href="{{ url_for('about') }}">About</a>
      <a class="nav-link {% if request.path == url_for('contact') %}active{% endif %}" href="{{ url_for('contact') }}">Contact</a>
      {% if logged_in_user %}
        <a class="nav-link" id="nav-dashboard-link"
           href="{{ url_for(logged_in_user['role'] ~ '_dashboard') }}">Dashboard</a>
        <a class="btn btn-cq-outline btn-sm ms-2" id="nav-logout-link" href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a class="nav-link" id="nav-login-link" href="{{ url_for('login') }}">Login</a>
        <a class="btn btn-amber btn-sm ms-2" id="nav-register-link" href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>

{% block body %}{% endblock %}

<footer class="cq-footer">
  <div class="container d-flex flex-wrap justify-content-between gap-3">
    <div>
      <strong style="color:#fff;">Campus Queue</strong>
      <div class="mt-1">Skip the line. Track your turn from anywhere on campus.</div>
    </div>
    <div class="d-flex gap-3">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('contact') }}">Contact</a>
      <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</footer>

<script id="flash-data" type="application/json">
[{% for category, message in get_flashed_messages(with_categories=true) %}{"category": "{{ category }}", "message": {{ message | tojson }}}{% if not loop.last %},{% endif %}{% endfor %}]
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
